[package]
name = "icv-backend"
version = "0.1.0"
edition = "2024"
license = "AGPL-3"

[dependencies]
async-opcua = "0.19.0"
onnxruntime = "0.0.14"
reqwest = { version = "0.13.4", features = ["json"] }
rumqttc = "0.25.1"
rustls = "0.23.43"
serde_json = "1.0.151"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
simple_logger = "5.2.0"
serde = "1.0.229"
config = "0.15.27"
serde_repr = "0.1.21"
bytes = "1.12.1"
getset = "0.1.7"
sha2 = "0.11.0"
tokio = "1.53.1"
hex = "0.4.3"
uuid = { version = "1.26.1", features = ["v4"] }
image = "0.25.10"
ort = "2.0.0-rc.13"

[features]
default = ["cpu"]
cpu = []
directml = ["ort/directml"]
coreml = ["ort/coreml"]
openvino = ["ort/openvino"]
migraphx = ["ort/migraphx"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]